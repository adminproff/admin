name: OP Kiosk OS 2.0 — extract previous small diagnostics

on:
  push:
    branches:
      - op-kiosk-os-2.0-rewrite
    paths:
      - ".github/workflows/op-kiosk-os-2.0-extract-old-diagnostics.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  extract:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      SOURCE_ARTIFACT_ID: "9917850011"

    steps:
      - name: Скачать предыдущий диагностический архив
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuxo pipefail
          gh api \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${SOURCE_ARTIFACT_ID}/zip" \
            > /tmp/previous-diagnostics.zip
          ls -lh /tmp/previous-diagnostics.zip

      - name: Извлечь только малые журналы
        shell: bash
        run: |
          set -Eeuxo pipefail
          mkdir -p previous-small-diagnostics
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          source = Path('/tmp/previous-diagnostics.zip')
          target = Path('previous-small-diagnostics')
          selected = []

          with ZipFile(source) as archive:
              listing = []
              for info in archive.infolist():
                  listing.append(f"{info.file_size:12d}  {info.filename}")
                  name = info.filename
                  lower = name.lower()
                  if info.is_dir():
                      continue
                  if '/work/' in lower or lower.startswith('work/'):
                      continue
                  if info.file_size > 50 * 1024 * 1024:
                      continue
                  if lower.endswith(('.log', '.txt', '.png', '.sha256', '.source-path')):
                      safe_name = name.replace('/', '__')
                      destination = target / safe_name
                      with archive.open(info) as src, destination.open('wb') as dst:
                          while True:
                              chunk = src.read(1024 * 1024)
                              if not chunk:
                                  break
                              dst.write(chunk)
                      selected.append(f"{info.file_size:12d}  {name} -> {safe_name}")

              (target / 'ARCHIVE-CONTENTS.txt').write_text(
                  '\n'.join(listing) + '\n', encoding='utf-8'
              )
              (target / 'EXTRACTED-FILES.txt').write_text(
                  '\n'.join(selected) + '\n', encoding='utf-8'
              )

          if not selected:
              raise SystemExit('Не найдено подходящих диагностических файлов')
          PY
          du -ah previous-small-diagnostics | sort -h | tail -n 100

      - name: Загрузить малый диагностический пакет
        uses: actions/upload-artifact@v4
        with:
          name: OP-Kiosk-OS-2.0-previous-small-diagnostics
          path: previous-small-diagnostics
          if-no-files-found: error
          retention-days: 7
          compression-level: 6
