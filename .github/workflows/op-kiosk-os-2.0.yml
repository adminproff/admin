          compression-level: 0

      - name: Проверенный ISO — часть 03
        if: success() && hashFiles('v2/release-parts/OP-Kiosk-OS-2.0.0-alpha1-amd64.iso.part-03.bin') != ''
        uses: actions/upload-artifact@v4
        with:
