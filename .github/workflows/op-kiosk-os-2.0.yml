name: OP Kiosk OS 2.0 — build, install test and split release

on:
  push:
    branches:
      - op-kiosk-os-2.0-rewrite
    paths:
      - "v2/**"
      - ".github/workflows/op-kiosk-os-2.0.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: op-kiosk-os-2.0-rewrite
  cancel-in-progress: true

env:
  OPKIOSK_VERSION: 2.0.0-alpha1
  OPKIOSK_URL: http://op-arkhbum.local:3080
  OPKIOSK_PART_SIZE_MIB: 200
  OPKIOSK_MAX_PARTS: 12

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Получение исходников
        uses: actions/checkout@v4

      - name: Освобождение места на runner
        shell: bash
        run: |
          set -Eeuxo pipefail
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet || true
          sudo docker system prune --all --force --volumes || true
          df -h

      - name: Установка инструментов тестирования на runner
        shell: bash
        run: |
          set -Eeuxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xorriso squashfs-tools ca-certificates curl file jq \
            qemu-system-x86 qemu-utils ovmf socat imagemagick shellcheck

          if [ -e /dev/kvm ]; then
            sudo chmod a+rw /dev/kvm || true
          fi

          qemu-system-x86_64 --version
          xorriso -version
          df -h

      - name: Статическая проверка исходников
        shell: bash
        run: |
          set -Eeuxo pipefail
          chmod +x \
            v2/build.sh \
            v2/prepare-config.sh \
            v2/fix-generated-config.sh \
            v2/post-config-hardening.sh \
            v2/create-release-parts.sh \
            v2/ci/strengthen-test.sh \
            v2/ci/test-full-cycle.sh

          bash -n v2/build.sh
          bash -n v2/prepare-config.sh
          bash -n v2/fix-generated-config.sh
          bash -n v2/post-config-hardening.sh
          bash -n v2/create-release-parts.sh
          bash -n v2/ci/strengthen-test.sh
          bash -n v2/ci/test-full-cycle.sh

          shellcheck -x -S warning \
            v2/build.sh \
            v2/prepare-config.sh \
            v2/fix-generated-config.sh \
            v2/post-config-hardening.sh \
            v2/create-release-parts.sh \
            v2/ci/strengthen-test.sh \
            v2/ci/test-full-cycle.sh

      - name: Сборка OP Kiosk OS 2.0 в Debian 13
        shell: bash
        run: |
          set -Eeuxo pipefail

          docker run --rm --privileged \
            --security-opt apparmor=unconfined \
            -v "$GITHUB_WORKSPACE:/work" \
            -w /work \
            -e OPKIOSK_VERSION \
            -e OPKIOSK_URL \
            debian:trixie \
            bash -lc '
              set -Eeuxo pipefail
              export DEBIAN_FRONTEND=noninteractive
              apt-get update
              apt-get install -y --no-install-recommends \
                live-build debootstrap xorriso squashfs-tools dosfstools rsync \
                ca-certificates curl gnupg file isolinux syslinux-common \
                grub-pc-bin grub-efi-amd64-bin grub-efi-amd64-signed shim-signed \
                mtools fdisk parted jq python3-minimal

              lb --version
              chmod +x \
                v2/build.sh \
                v2/prepare-config.sh \
                v2/fix-generated-config.sh \
                v2/post-config-hardening.sh
              OPKIOSK_SKIP_APT=1 bash v2/build.sh
            '

          sudo chown -R "$USER:$USER" v2/output v2/.work
          ls -lh v2/output
          cat v2/output/BUILD-INFO.txt
          df -h

      - name: Полный цикл установки и холодной загрузки
        shell: bash
        run: |
          set -Eeuxo pipefail
          ISO="v2/output/OP-Kiosk-OS-${OPKIOSK_VERSION}-amd64.iso"
          test -s "$ISO"

          bash v2/ci/strengthen-test.sh v2/ci/test-full-cycle.sh
          bash -n v2/ci/test-full-cycle.sh

          mkdir -p v2/test-results
          v2/ci/test-full-cycle.sh "$ISO" v2/test-results \
            2>&1 | tee v2/test-results/workflow-console.log

          grep -F 'OP Kiosk OS full-cycle CI: PASS' \
            v2/test-results/full-cycle-report.txt

      - name: Подготовка малых частей проверенного ISO
        shell: bash
        run: |
          set -Eeuxo pipefail
          ISO="v2/output/OP-Kiosk-OS-${OPKIOSK_VERSION}-amd64.iso"

          v2/create-release-parts.sh "$ISO" v2/release-parts

          cp -f v2/output/BUILD-INFO.txt v2/release-parts/
          cp -f v2/test-results/full-cycle-report.txt v2/release-parts/
          cp -f v2/test-results/*-ready.png v2/release-parts/ 2>/dev/null || true
          cp -f v2/test-results/*-menu.png v2/release-parts/ 2>/dev/null || true

          test -s v2/release-parts/PART-COUNT.txt
          PART_COUNT="$(cat v2/release-parts/PART-COUNT.txt)"
          test "$PART_COUNT" -ge 1
          test "$PART_COUNT" -le "$OPKIOSK_MAX_PARTS"

          echo "Создано частей: $PART_COUNT"
          ls -lh v2/release-parts
          df -h

      - name: Сводка результата
        if: always()
        shell: bash
        run: |
          {
            echo '# OP Kiosk OS 2.0 CI'
            echo
            if [ -f v2/output/BUILD-INFO.txt ]; then
              echo '## Build'
              echo '```text'
              cat v2/output/BUILD-INFO.txt
              echo '```'
            fi
            if [ -f v2/test-results/full-cycle-report.txt ]; then
              echo '## Full cycle'
              echo '```text'
              cat v2/test-results/full-cycle-report.txt
              echo '```'
            fi
            if [ -f v2/release-parts/DOWNLOAD-INFO.txt ]; then
              echo '## Split release'
              echo '```text'
              cat v2/release-parts/DOWNLOAD-INFO.txt
              echo '```'
            fi
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Диагностика независимо от результата
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OP-Kiosk-OS-2.0-alpha1-diagnostics
          path: |
            v2/output/BUILD-INFO.txt
            v2/output/*.iso.sha256
            v2/output/logs
            v2/test-results
          if-no-files-found: warn
          retention-days: 30
          compression-level: 6

      - name: Малый комплект сборки и проверки
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: OP-Kiosk-OS-2.0.0-alpha1-DOWNLOAD-KIT
          path: |
            v2/release-parts/MERGE-OP-Kiosk-OS-2.0.cmd
            v2/release-parts/MERGE-OP-Kiosk-OS-2.0.ps1
            v2/release-parts/README-FIRST-RU.txt
            v2/release-parts/DOWNLOAD-INFO.txt
            v2/release-parts/PART-COUNT.txt
            v2/release-parts/OP-Kiosk-OS-2.0.0-alpha1-parts.sha256
            v2/release-parts/OP-Kiosk-OS-2.0.0-alpha1-amd64.iso.sha256
            v2/release-parts/BUILD-INFO.txt
            v2/release-parts/full-cycle-report.txt
            v2/release-parts/*-ready.png
            v2/release-parts/*-menu.png
          if-no-files-found: error
          retention-days: 14
          compression-level: 6

      - name: Проверенный ISO — часть 01
        if: success() && hashFiles('v2/release-parts/OP-Kiosk-OS-2.0.0-alpha1-amd64.iso.part-01.bin') != ''
        uses: actions/upload-artifact@v4
        with:
          name: OP-Kiosk-OS-2.0.0-alpha1-PART-01
          path: v2/release-parts/OP-Kiosk-OS-2.0.0-alpha1-amd64.iso.part-01.bin
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Проверенный ISO — часть 02
        if: success() && hashFiles('v2/release-parts/OP-Kiosk-OS-2.0.0-alpha1-amd64.iso.part-02.bin') != ''
        uses: actions/upload-artifact@v4
        with:
          name: OP-Kiosk-OS-2.0.0-alpha1-PART-02
          path: v2/release-parts/OP-Kiosk-OS-2.0.0-alpha1-amd64.iso.part-02.bin
