name: Build, boot-test and publish OP Kiosk OS 1.3 R3

on:
  push:
    branches: [master]
    paths:
      - build.sh
      - patch-v1.1.py
      - patch-v1.3.py
      - .github/workflows/build-v1.3-r3.yml
  workflow_dispatch:

permissions:
  contents: write

env:
  ISO_NAME: OP-Kiosk-OS-1.3-amd64.iso
  RELEASE_TAG: op-kiosk-os-1.3

jobs:
  build-boot-test-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 150

    steps:
      - name: Получение исходников
        uses: actions/checkout@v4

      - name: Подготовка исходника версии 1.3
        run: |
          set -Eeuxo pipefail
          python3 patch-v1.1.py
          python3 patch-v1.3.py
          grep -F 'VERSION="1.3"' build.sh
          grep -F 'lightdm' build.sh
          grep -F 'https://op.arkhbum.local' build.sh
          grep -F 'autologin-session=op-kiosk' build.sh
          grep -F 'OPKIOSK_BROWSER_OK' build.sh
          bash -n build.sh

      - name: Сборка загрузочного ISO в Debian 13
        run: |
          set -Eeuxo pipefail
          docker run --rm --privileged \
            -v "$GITHUB_WORKSPACE:/work" \
            -w /work \
            debian:trixie \
            bash -lc "sed -i '/--boot-timeout 1/d' build.sh; chmod +x build.sh; ./build.sh"

      - name: Проверка ISO и контрольной суммы
        run: |
          set -Eeuxo pipefail
          sudo chown -R "$USER:$USER" output
          test -s "output/$ISO_NAME"
          cd output
          sha256sum "$ISO_NAME" > "${ISO_NAME}.sha256"
          sha256sum -c "${ISO_NAME}.sha256"
          file "$ISO_NAME" | tee iso-release-file-info.txt
          test "$(stat -c '%s' "$ISO_NAME")" -gt 500000000
          cd ..
          sudo rm -rf .build
          docker system prune -af || true
          df -h /

      - name: Извлечение финальной live-системы
        run: |
          set -Eeuxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xorriso squashfs-tools qemu-system-x86 qemu-utils
          mkdir -p runtime-test/live
          xorriso -osirrox on \
            -indev "output/$ISO_NAME" \
            -extract /live runtime-test/live
          sudo unsquashfs -d runtime-test/rootfs \
            runtime-test/live/filesystem.squashfs

      - name: Статическая проверка финального SquashFS
        run: |
          set -Eeuxo pipefail
          ROOT=runtime-test/rootfs
          test -x "$ROOT/opt/op-kiosk/session.sh"
          test -x "$ROOT/opt/op-kiosk/start-browser.sh"
          test -x "$ROOT/opt/op-kiosk/smoke-test.sh"
          test -x "$ROOT/opt/op-kiosk/admin-terminal.sh"
          test -f "$ROOT/etc/lightdm/lightdm.conf.d/50-op-kiosk.conf"
          test -f "$ROOT/usr/share/xsessions/op-kiosk.desktop"
          test -L "$ROOT/etc/systemd/system/display-manager.service"
          grep -F 'autologin-user=kiosk' "$ROOT/etc/lightdm/lightdm.conf.d/50-op-kiosk.conf"
          grep -F 'autologin-session=op-kiosk' "$ROOT/etc/lightdm/lightdm.conf.d/50-op-kiosk.conf"
          grep -F 'https://op.arkhbum.local' "$ROOT/var/lib/op-kiosk/kiosk.conf"
          grep -F 'exec /opt/op-kiosk/start-browser.sh' "$ROOT/opt/op-kiosk/xinitrc"
          grep -F 'LOG=/tmp/op-kiosk-browser.log' "$ROOT/opt/op-kiosk/start-browser.sh"
          test "$(stat -c '%u' "$ROOT/var/log/op-kiosk")" = 1000
          test "$(stat -c '%g' "$ROOT/var/log/op-kiosk")" = 1000
          test "$(stat -c '%u' "$ROOT/var/lib/op-kiosk")" = 1000
          test "$(stat -c '%g' "$ROOT/var/lib/op-kiosk")" = 1000
          readlink "$ROOT/etc/systemd/system/default.target"
          readlink "$ROOT/etc/systemd/system/display-manager.service"

      - name: Полная загрузка ISO и проверка страницы в Chromium
        run: |
          set -Eeuxo pipefail

          KERNEL="$(find runtime-test/live -maxdepth 1 -type f -name 'vmlinuz*' | sort | head -1)"
          INITRD="$(find runtime-test/live -maxdepth 1 -type f -name 'initrd*' | sort | head -1)"
          test -s "$KERNEL"
          test -s "$INITRD"

          SERIAL="$GITHUB_WORKSPACE/runtime-test/qemu-serial.log"
          QEMU_LOG="$GITHUB_WORKSPACE/runtime-test/qemu.log"
          : >"$SERIAL"
          : >"$QEMU_LOG"

          qemu-system-x86_64 \
            -name op-kiosk-1.3-test \
            -machine q35,accel=tcg \
            -cpu max \
            -smp 2 \
            -m 3072 \
            -kernel "$KERNEL" \
            -initrd "$INITRD" \
            -append "boot=live components live-media=/dev/sr0 username=kiosk hostname=op-kiosk locales=ru_RU.UTF-8 keyboard-layouts=us opkiosk.smoketest console=ttyS0,115200n8 console=tty0 loglevel=4 systemd.show_status=true" \
            -drive "file=output/$ISO_NAME,media=cdrom,readonly=on,format=raw" \
            -device e1000,netdev=net0 \
            -netdev user,id=net0 \
            -vga std \
            -display none \
            -serial "file:$SERIAL" \
            -monitor none \
            -no-reboot \
            >"$QEMU_LOG" 2>&1 &
          QEMU_PID=$!

          cleanup() {
            kill "$QEMU_PID" 2>/dev/null || true
            wait "$QEMU_PID" 2>/dev/null || true
          }
          trap cleanup EXIT

          ok=0
          for _ in $(seq 1 420); do
            if grep -q 'OPKIOSK_BROWSER_OK' "$SERIAL"; then
              ok=1
              break
            fi
            if ! kill -0 "$QEMU_PID" 2>/dev/null; then
              break
            fi
            sleep 1
          done

          cat "$QEMU_LOG" || true
          tail -n 600 "$SERIAL" || true

          if [[ $ok -ne 1 ]]; then
            echo 'Полная загрузка не подтвердила автоматический запуск Chromium и загрузку тестовой страницы.' >&2
            exit 1
          fi

          cat > runtime-test/full-boot-test.txt <<'EOF'
          OPKIOSK_FULL_BOOT_TEST=PASS
          OPKIOSK_LIGHTDM_KIOSK_SESSION=PASS
          OPKIOSK_CHROMIUM_AUTOSTART=PASS
          OPKIOSK_START_PAGE_LOADED=PASS
          EOF
          cat runtime-test/full-boot-test.txt

      - name: Формирование манифеста проверенного релиза
        run: |
          set -Eeuxo pipefail
          ISO_SIZE="$(stat -c '%s' "output/$ISO_NAME")"
          ISO_SHA256="$(sha256sum "output/$ISO_NAME" | awk '{print $1}')"
          cat > runtime-test/OP-Kiosk-OS-1.3-FINAL-VERIFIED.txt <<EOF
          OP Kiosk OS 1.3 — VERIFIED RELEASE
          Commit: $GITHUB_SHA
          Workflow run: $GITHUB_RUN_ID
          ISO: $ISO_NAME
          Size: $ISO_SIZE bytes
          SHA-256: $ISO_SHA256
          ISO file check: PASS
          SquashFS static check: PASS
          Full QEMU live boot: PASS
          LightDM kiosk session: PASS
          Chromium autostart and local test page: PASS
          Default URL: https://op.arkhbum.local
          EOF
          cat runtime-test/OP-Kiosk-OS-1.3-FINAL-VERIFIED.txt

      - name: Публикация журналов проверки
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OP-Kiosk-OS-1.3-full-boot-test-r3
          path: |
            runtime-test/full-boot-test.txt
            runtime-test/OP-Kiosk-OS-1.3-FINAL-VERIFIED.txt
            runtime-test/qemu-serial.log
            runtime-test/qemu.log
          if-no-files-found: warn
          retention-days: 30

      - name: Публикация ISO как артефакта
        uses: actions/upload-artifact@v4
        with:
          name: OP-Kiosk-OS-1.3-amd64-r3
          path: |
            output/OP-Kiosk-OS-1.3-amd64.iso
            output/OP-Kiosk-OS-1.3-amd64.iso.sha256
            output/iso-release-file-info.txt
            output/iso-boot-report.txt
            output/iso-live-files.txt
            output/iso-file-info.txt
            output/build.log
            runtime-test/full-boot-test.txt
            runtime-test/OP-Kiosk-OS-1.3-FINAL-VERIFIED.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Создание релиза только после успешной полной проверки
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuxo pipefail
          gh release delete "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --cleanup-tag \
            --yes 2>/dev/null || true

          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "OP Kiosk OS 1.3 для HP t530 — проверенный релиз" \
            --notes "ISO опубликован только после успешной сборки, статической проверки финального SquashFS и полной загрузки live-системы в QEMU. В тесте подтверждены запуск kiosk-сессии LightDM, автоматический запуск Chromium и загрузка встроенной тестовой страницы. Рабочий URL по умолчанию: https://op.arkhbum.local."

          gh release upload "$RELEASE_TAG" \
            "output/$ISO_NAME#OP Kiosk OS 1.3 — загрузочный ISO" \
            "output/${ISO_NAME}.sha256#SHA-256 контрольная сумма" \
            "runtime-test/full-boot-test.txt#Отчёт полной загрузочной проверки" \
            "runtime-test/OP-Kiosk-OS-1.3-FINAL-VERIFIED.txt#Манифест проверенного релиза" \
            --repo "$GITHUB_REPOSITORY"
