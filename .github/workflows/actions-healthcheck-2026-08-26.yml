name: GitHub Actions health check 2026-08-26

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/actions-healthcheck-2026-08-26.yml
  workflow_dispatch:

jobs:
  healthcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Проверка запуска GitHub-hosted runner
        run: |
          set -Eeuo pipefail
          echo "GITHUB_ACTIONS_HEALTHCHECK=PASS"
          uname -a
          date -u +'%Y-%m-%dT%H:%M:%SZ'
