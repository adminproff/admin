name: OP Kiosk OS 1.3 - FINAL RELEASE ISO

on:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/build-v1.3-final-release.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: op-kiosk-os-1.3-final-release
  cancel-in-progress: true

env:
  ISO_NAME: OP-Kiosk-OS-1.3-amd64.iso
  RELEASE_TAG: op-kiosk-os-1.3
  EXPECTED_URL: http://op-arkhbum.local:3080

jobs:
  build-test-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Получение исходников
        uses: actions/checkout@v4

      - name: Подготовка исходников версии 1.3
        run: |
          set -Eeuxo pipefail
          python3 patch-v1.1.py
          python3 patch-v1.3.py
          python3 patch-v1.3-final.py

          grep -F 'VERSION="1.3"' build.sh
          grep -F "KIOSK_URL=$EXPECTED_URL" build.sh
          grep -F "EXPECTED_URL='$EXPECTED_URL'" build.sh
          grep -F 'autologin-user=kiosk' build.sh
          grep -F 'autologin-session=op-kiosk' build.sh
          grep -F 'OPKIOSK_RUNTIME_READY' build.sh
          grep -F 'OPKIOSK_SMOKE_PASS' build.sh
          grep -F "setxkbmap -layout 'us'" build.sh

          bash -n build.sh
          bash -n ci/verify-op-kiosk-1.3-v2.sh
          python3 -m py_compile patch-v1.1.py patch-v1.3.py patch-v1.3-final.py

      - name: Сборка ISO-hybrid в Debian 13
        run: |
          set -Eeuxo pipefail
          docker run --rm --privileged \
            -v "$GITHUB_WORKSPACE:/work" \
            -w /work \
            debian:trixie \
            bash -lc "sed -i '/--boot-timeout 1/d' build.sh; chmod +x build.sh; ./build.sh"

      - name: Установка инструментов проверки
        run: |
          set -Eeuxo pipefail
          sudo chown -R "$USER:$USER" output
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xorriso squashfs-tools qemu-system-x86 qemu-utils ovmf \
            socat imagemagick file

          test -s "output/$ISO_NAME"
          test "$(stat -c %s "output/$ISO_NAME")" -gt 500000000
          (
            cd output
            sha256sum "$ISO_NAME" >"${ISO_NAME}.sha256"
            sha256sum -c "${ISO_NAME}.sha256"
          )

      - name: Полная проверка ISO в BIOS и UEFI
        env:
          TIMEOUT_NORMAL: "900"
          TIMEOUT_SMOKE: "900"
        run: |
          set -Eeuxo pipefail
          chmod +x ci/verify-op-kiosk-1.3-v2.sh
          mkdir -p runtime-test-final

          set +e
          sudo --preserve-env=EXPECTED_URL,TIMEOUT_NORMAL,TIMEOUT_SMOKE \
            ci/verify-op-kiosk-1.3-v2.sh \
            "output/$ISO_NAME" runtime-test-final \
            2>&1 | tee runtime-test-final/verifier.log
          RC=${PIPESTATUS[0]}
          set -e

          sudo chown -R "$USER:$USER" runtime-test-final 2>/dev/null || true
          exit "$RC"

      - name: Диагностика независимо от результата
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OP-Kiosk-OS-1.3-final-release-diagnostics
          path: |
            runtime-test-final/verifier.log
            runtime-test-final/*.log
            runtime-test-final/*.txt
            runtime-test-final/*.png
            runtime-test-final/*.sha256
            output/build.log
            output/iso-boot-report.txt
            output/iso-live-files.txt
            output/iso-file-info.txt
          if-no-files-found: warn
          retention-days: 30

      - name: Загрузка проверенного ISO в артефакты
        uses: actions/upload-artifact@v4
        with:
          name: OP-Kiosk-OS-1.3-amd64-FINAL
          path: |
            output/OP-Kiosk-OS-1.3-amd64.iso
            output/OP-Kiosk-OS-1.3-amd64.iso.sha256
            runtime-test-final/verification-report.txt
            runtime-test-final/normal-bios-screen.png
            runtime-test-final/normal-uefi-screen.png
            runtime-test-final/smoke-local-page-screen.png
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Подготовка описания релиза
        run: |
          set -Eeuxo pipefail
          cat >runtime-test-final/release-notes.md <<EOF
          # OP Kiosk OS 1.3 для HP t530

          Рабочий URL по умолчанию: \`$EXPECTED_URL\`.

          Этот конкретный ISO до публикации автоматически прошёл:

          - проверку ISO9660 и El Torito;
          - наличие загрузчиков BIOS и UEFI;
          - полную обычную загрузку ISO в QEMU BIOS;
          - полную обычную загрузку ISO в QEMU UEFI;
          - получение сетевого маршрута по DHCP;
          - автологин пользователя kiosk через LightDM;
          - запуск X11 и Openbox;
          - запуск Chromium с точным адресом \`$EXPECTED_URL\`;
          - отдельную проверку фактической отрисовки страницы Chromium через DevTools;
          - проверку реальных скриншотов экрана;
          - контроль SHA-256 после повторного скачивания релиза.

          Внутренний сервер \`$EXPECTED_URL\` недоступен из GitHub Actions. CI подтверждает точную передачу этого адреса в Chromium и отдельно подтверждает фактическую отрисовку встроенной страницы браузером. Проверку именно на физическом HP t530 удалённо подменить невозможно.

          Полный машинный отчёт: \`verification-report.txt\`.
          EOF
          sed -i 's/^          //' runtime-test-final/release-notes.md

      - name: Публикация GitHub Release только после PASS
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuxo pipefail

          grep -F 'ISO9660 / El Torito: PASS' runtime-test-final/verification-report.txt
          grep -F 'Chromium с рабочим URL при обычной BIOS-загрузке ISO: PASS' \
            runtime-test-final/verification-report.txt
          grep -F 'Chromium с рабочим URL при обычной UEFI-загрузке ISO: PASS' \
            runtime-test-final/verification-report.txt
          grep -F 'Фактическая отрисовка встроенной страницы Chromium через DevTools: PASS' \
            runtime-test-final/verification-report.txt

          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "OP Kiosk OS 1.3 для HP t530 — финальный ISO" \
              --notes-file runtime-test-final/release-notes.md \
              --latest
          else
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "OP Kiosk OS 1.3 для HP t530 — финальный ISO" \
              --notes-file runtime-test-final/release-notes.md \
              --latest
          fi

          gh release upload "$RELEASE_TAG" \
            "output/$ISO_NAME" \
            "output/${ISO_NAME}.sha256" \
            runtime-test-final/verification-report.txt \
            runtime-test-final/normal-bios-screen.png \
            runtime-test-final/normal-uefi-screen.png \
            runtime-test-final/smoke-local-page-screen.png \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

      - name: Повторное скачивание опубликованного ISO
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuxo pipefail
          rm -rf release-check
          mkdir release-check

          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --dir release-check

          test -s "release-check/$ISO_NAME"
          test -s "release-check/${ISO_NAME}.sha256"

          (
            cd release-check
            sha256sum -c "${ISO_NAME}.sha256"
          )

          EXPECTED_SHA="$(sha256sum "output/$ISO_NAME" | awk '{print $1}')"
          RELEASE_SHA="$(sha256sum "release-check/$ISO_NAME" | awk '{print $1}')"
          test "$EXPECTED_SHA" = "$RELEASE_SHA"

          gh release view "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json url,tagName,isLatest,assets \
            >runtime-test-final/release-verification.json
          cat runtime-test-final/release-verification.json
